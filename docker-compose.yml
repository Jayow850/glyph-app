services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: glyph
      POSTGRES_PASSWORD: glyph
      POSTGRES_DB: glyph
    ports:
      - "5433:5432"
    volumes:
      - glyph_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glyph -d glyph"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  glyph_pgdata: